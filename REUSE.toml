# ── In-file text that is not the file's own notice ───────────────────────────
# These files quote SPDX lines as examples or patterns (licensing docs, a sed
# pattern in CI, a header template in a build script), or quote third-party
# copyright lines (the notices files). Their own holder and licence are DeMoD
# LLC and LGPL-3.0-only.
[[annotations]]
path = [
  "LICENSING.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "lua/LICENSING.md",
  ".github/workflows/wire-certify.yml",
